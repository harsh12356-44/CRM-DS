name: Deploy CRM-DS to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger Live Server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Build Next.js on GitHub Runner & Package
        run: |
          npm ci
          npx prisma generate
          npm run build
          tar -czf next_build.tar.gz .next

      - name: 🚀 Update Source Code on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          script: |
            echo "Updating code on Hostinger..."
            export PATH=/opt/alt/alt-nodejs20/root/bin:$PATH
            cd ${{ secrets.TARGET_DIR }}

            # 1. Back up live database and clean any invalid public/_next
            mkdir -p data
            if [ -f data/db.json ]; then
              cp data/db.json /tmp/hrm_live_db_backup.json
            fi
            rm -rf public/_next

            # 2. Update source files
            git fetch --all
            git checkout -f main
            git reset --hard origin/main

            # 3. Restore live database
            if [ -f /tmp/hrm_live_db_backup.json ]; then
              cp /tmp/hrm_live_db_backup.json data/db.json
            fi

            # 4. Install dependencies (no heavy compilation on Hostinger!)
            npm install
            npx prisma generate

      - name: 📤 Upload Pre-Built Archive to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          source: "next_build.tar.gz"
          target: ${{ secrets.TARGET_DIR }}
          overwrite: true

      - name: 🔄 Extract Build & Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          script: |
            cd ${{ secrets.TARGET_DIR }}
            # 1. Back up previous static CSS to prevent 404s for users with open tabs
            mkdir -p /tmp/hrm_prev_css
            if [ -d .next/static/css ]; then
              cp -f .next/static/css/*.css /tmp/hrm_prev_css/ 2>/dev/null || true
            fi

            # 2. Extract new build
            rm -rf .next
            tar -xzf next_build.tar.gz
            rm -f next_build.tar.gz

            # 3. Restore previous CSS files alongside new ones (prevents 404 on any open browser tabs)
            if [ -d /tmp/hrm_prev_css ]; then
              cp -n /tmp/hrm_prev_css/*.css .next/static/css/ 2>/dev/null || true
            fi

            chmod -R 755 .next public data || true
            mkdir -p tmp
            touch tmp/restart.txt

            # 4. Trigger LiteSpeed & Hostinger CDN edge cache purge across the domain
            curl -s -k -H "X-LiteSpeed-Purge: *" "https://mediumvioletred-fox-353008.hostingersite.com/login" > /dev/null 2>&1 || true
            curl -s -k -H "X-LiteSpeed-Purge: *" "https://mediumvioletred-fox-353008.hostingersite.com/admin/attendance" > /dev/null 2>&1 || true

            echo "Application updated, legacy CSS preserved, and edge caches purged successfully!"












