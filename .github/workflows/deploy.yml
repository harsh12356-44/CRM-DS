name: Deploy CRM-DS to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger Live Server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies & Build locally to verify
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: 🚀 Deploy & Restart Application on Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          script: |
            echo "Starting zero-downtime Hostinger deployment..."
            export PATH=/opt/alt/alt-nodejs22/root/bin:$PATH

            TARGET_PATH="${{ secrets.TARGET_DIR }}"
            STAGING_PATH="${TARGET_PATH}_build_staging"

            # 1. Back up live database
            if [ -f "$TARGET_PATH/data/db.json" ]; then
              cp "$TARGET_PATH/data/db.json" /tmp/hrm_live_db_backup.json
            fi

            # 2. Prepare staging build directory
            mkdir -p "$STAGING_PATH"
            cd "$STAGING_PATH"
            if [ ! -d .git ]; then
              git clone https://github.com/harsh12356-44/CRM-DS.git .
            fi
            git fetch --all
            git checkout -f main
            git reset --hard origin/main

            # 3. Build inside staging directory (keeps live site 100% active with zero 503 errors)
            npm install
            npx prisma generate
            npm run build

            # 4. Atomically sync completed build artifacts to live TARGET_PATH
            rsync -a --delete "$STAGING_PATH/.next/" "$TARGET_PATH/.next/"
            rsync -a --delete "$STAGING_PATH/node_modules/" "$TARGET_PATH/node_modules/"
            rsync -a --delete --exclude='.next' --exclude='node_modules' --exclude='data' "$STAGING_PATH/" "$TARGET_PATH/"

            # 5. Restore live database safely into TARGET_PATH/data/
            mkdir -p "$TARGET_PATH/data"
            if [ -f /tmp/hrm_live_db_backup.json ]; then
              cp /tmp/hrm_live_db_backup.json "$TARGET_PATH/data/db.json"
            elif [ -f "$STAGING_PATH/data/db.json" ]; then
              cp "$STAGING_PATH/data/db.json" "$TARGET_PATH/data/db.json"
            fi


            # 6. Signal Hostinger Passenger to restart Node process
            cd "$TARGET_PATH"
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Zero-Downtime Deployment Completed Successfully!"









