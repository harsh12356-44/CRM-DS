name: Deploy CRM-DS to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger Live Server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies & Build locally to verify
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: 🚀 Deploy & Restart Application on Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          script: |
            echo "Starting reliable Hostinger deployment..."
            export PATH=/opt/alt/alt-nodejs20/root/bin:$PATH
            export RAYON_NUM_THREADS=1
            export NEXT_CPU_COUNT=1
            export UV_THREADPOOL_SIZE=1
            export NODE_OPTIONS="--max-old-space-size=1536"

            cd ${{ secrets.TARGET_DIR }}

            # 1. Back up live database
            mkdir -p data
            if [ -f data/db.json ]; then
              cp data/db.json /tmp/hrm_live_db_backup.json
            fi

            # 2. Pull latest code from GitHub main
            git fetch --all
            git checkout -f main
            git reset --hard origin/main

            # 3. Restore live database safely so no records are lost
            mkdir -p data
            if [ -f /tmp/hrm_live_db_backup.json ]; then
              cp /tmp/hrm_live_db_backup.json data/db.json
            fi

            # 4. Install dependencies and generate Prisma client
            npm install
            npx prisma generate

            # 5. Remove any conflicting public/_next folder if present
            rm -rf public/_next

            # 6. Build Next.js
            npm run build

            # 7. Set world-readable permissions for static assets
            chmod -R 755 .next public node_modules data || true

            # 8. Clean stale sockets and trigger Hostinger Passenger restart
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deployment Completed & Server Restarted Successfully!"










